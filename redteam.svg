<svg width="170" height="34" viewBox="0 0 170 34" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0F3C">
        <animate attributeName="stop-color" values="#FF0F3C;#FF3D6E;#FF0F3C" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#D1002F"/>
      <stop offset="100%" stop-color="#6E0018">
        <animate attributeName="stop-color" values="#6E0018;#A3002B;#6E0018" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
  </defs>
  <text x="85" y="23" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="20" font-weight="800" letter-spacing="4" fill="#FF0F3C" opacity="0.55" filter="url(#glow)">RED TEAM</text>
  <text x="85" y="23" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, monospace"
        font-size="20" font-weight="800" letter-spacing="4" fill="url(#red)">RED TEAM</text>
</svg>
