<svg width="1000" height="190" viewBox="0 0 1000 190" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0409"/>
      <stop offset="100%" stop-color="#060204"/>
    </linearGradient>
    <radialGradient id="g1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A0020" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8A0020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4D6D"/>
      <stop offset="50%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#B8002F"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF1744" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FF1744" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF1744" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FF1744" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="190" rx="22"/></clipPath>
  </defs>
  <style>
    @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1000" height="190" fill="url(#bg)"/>
    <ellipse cx="120" cy="30" rx="260" ry="130" fill="url(#g1)" filter="url(#blur)"/>
    <ellipse cx="900" cy="170" rx="300" ry="120" fill="url(#g2)" filter="url(#blur)"/>
    <rect width="1000" height="190" fill="url(#grid)"/>
    <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
      <animate attributeName="y" values="-60;190" dur="4.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="998" height="188" rx="21" fill="none" stroke="#FF1744" stroke-opacity="0.35"/>

    <text x="50" y="62" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" letter-spacing="3" fill="#FF6B85" opacity="0.8">$ whoami --offensive</text>
    <text x="50" y="118" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="52" font-weight="800" letter-spacing="6" fill="#FF1744" opacity="0.5" filter="url(#glow)">RED TEAM</text>
    <text x="50" y="118" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="52" font-weight="800" letter-spacing="6" fill="url(#title)">RED TEAM</text>
    <rect class="cursor" x="372" y="82" width="18" height="38" fill="#FF1744"/>
    <text x="50" y="154" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="4" fill="#FF8FA3" opacity="0.85">BUG BOUNTY  //  EXPLOIT DEVELOPMENT  //  SERVER DEFENSE</text>
  </g>
</svg>
