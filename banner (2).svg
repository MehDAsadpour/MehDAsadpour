<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F8FF"/>
      <stop offset="100%" stop-color="#EAF1FF"/>
    </linearGradient>

    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D6FE0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3D6FE0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0B2E8A" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0B2E8A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7FB2FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7FB2FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>

    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="28"/>
    </clipPath>
  </defs>

  <style>
    @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.95; } }
    @keyframes pulseSoft { 0%,100% { opacity: 0.15; } 50% { opacity: 0.5; } }
    @keyframes drift { 0% { transform: translateX(0); } 50% { transform: translateX(-24px); } 100% { transform: translateX(0); } }
    .node { fill: #0B2E8A; animation: pulse 3.2s ease-in-out infinite; }
    .link { stroke: #3D6FE0; stroke-width: 1.2; fill: none; animation: pulseSoft 4s ease-in-out infinite; }
    .manifoldGroup { animation: drift 14s ease-in-out infinite; }
    .manifold { stroke: #3D6FE0; stroke-width: 1; fill: none; opacity: 0.18; }
    .bell { stroke: #0B2E8A; stroke-width: 2.2; fill: none; opacity: 0.85; }
    .bellFill { fill: #3D6FE0; opacity: 0.08; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- ambient blurred color -->
    <ellipse cx="150" cy="60" rx="340" ry="170" fill="url(#blob2)" filter="url(#soft)"/>
    <ellipse cx="1000" cy="60" rx="360" ry="180" fill="url(#blob1)" filter="url(#soft)"/>
    <ellipse cx="600" cy="280" rx="420" ry="160" fill="url(#blob3)" filter="url(#soft)"/>

    <!-- manifold: drifting wireframe surface -->
    <g class="manifoldGroup">
      <path class="manifold" d="M-50,30 C150,10 350,55 550,30 C750,5 950,50 1150,25 C1250,15 1300,20 1350,15"/>
      <path class="manifold" d="M-50,255 C150,275 350,235 550,260 C750,285 950,240 1150,265 C1250,275 1300,260 1350,270"/>
      <path class="manifold" d="M-50,270 C150,250 350,290 550,270 C750,250 950,295 1150,275 C1250,265 1300,280 1350,275"/>
      <path class="manifold" d="M-50,15 C150,35 350,-5 550,15 C750,35 950,-5 1150,10 C1250,20 1300,5 1350,10"/>
    </g>

    <!-- normal distribution curve, bottom-left -->
    <path class="bellFill" d="M40,262 C100,262 130,192 200,187 C270,192 300,262 360,262 Z"/>
    <path class="bell" d="M40,262 C100,262 130,192 200,187 C270,192 300,262 360,262"/>
    <line x1="200" y1="187" x2="200" y2="262" stroke="#0B2E8A" stroke-width="1" stroke-dasharray="3,4" opacity="0.4"/>
    <circle r="4" fill="#0B2E8A">
      <animateMotion dur="5s" repeatCount="indefinite"
        path="M40,262 C100,262 130,192 200,187 C270,192 300,262 360,262"/>
    </circle>

    <!-- CNN-style layers, top-right -->
    <g>
      <!-- links: layer1(3) -> layer2(4) -->
      <path class="link" style="animation-delay:0s"   d="M800,56 L880,44"/>
      <path class="link" style="animation-delay:0.3s" d="M800,56 L880,68"/>
      <path class="link" style="animation-delay:0.6s" d="M800,80 L880,68"/>
      <path class="link" style="animation-delay:0.9s" d="M800,80 L880,92"/>
      <path class="link" style="animation-delay:1.2s" d="M800,104 L880,92"/>
      <path class="link" style="animation-delay:1.5s" d="M800,104 L880,116"/>
      <!-- links: layer2(4) -> layer3(3) -->
      <path class="link" style="animation-delay:0.2s" d="M880,44 L960,56"/>
      <path class="link" style="animation-delay:0.5s" d="M880,68 L960,56"/>
      <path class="link" style="animation-delay:0.8s" d="M880,68 L960,80"/>
      <path class="link" style="animation-delay:1.1s" d="M880,92 L960,80"/>
      <path class="link" style="animation-delay:1.4s" d="M880,92 L960,104"/>
      <path class="link" style="animation-delay:1.7s" d="M880,116 L960,104"/>
      <!-- links: layer3(3) -> layer4(2) -->
      <path class="link" style="animation-delay:0.1s" d="M960,56 L1040,68"/>
      <path class="link" style="animation-delay:0.4s" d="M960,80 L1040,68"/>
      <path class="link" style="animation-delay:0.7s" d="M960,80 L1040,92"/>
      <path class="link" style="animation-delay:1.0s" d="M960,104 L1040,92"/>

      <!-- flowing signal dots -->
      <circle r="3" fill="#3D6FE0">
        <animateMotion dur="2.4s" repeatCount="indefinite" path="M800,80 L880,68 L960,80 L1040,68"/>
      </circle>
      <circle r="3" fill="#3D6FE0">
        <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M800,56 L880,44 L960,56 L1040,68"/>
      </circle>

      <!-- nodes -->
      <circle class="node" cx="800" cy="56"  r="6" style="animation-delay:0s"/>
      <circle class="node" cx="800" cy="80"  r="6" style="animation-delay:0.4s"/>
      <circle class="node" cx="800" cy="104" r="6" style="animation-delay:0.8s"/>

      <circle class="node" cx="880" cy="44"  r="6" style="animation-delay:0.2s"/>
      <circle class="node" cx="880" cy="68"  r="6" style="animation-delay:0.6s"/>
      <circle class="node" cx="880" cy="92"  r="6" style="animation-delay:1.0s"/>
      <circle class="node" cx="880" cy="116" r="6" style="animation-delay:1.4s"/>

      <circle class="node" cx="960" cy="56"  r="6" style="animation-delay:0.3s"/>
      <circle class="node" cx="960" cy="80"  r="6" style="animation-delay:0.7s"/>
      <circle class="node" cx="960" cy="104" r="6" style="animation-delay:1.1s"/>

      <circle class="node" cx="1040" cy="68" r="6" style="animation-delay:0.5s"/>
      <circle class="node" cx="1040" cy="92" r="6" style="animation-delay:0.9s"/>
    </g>

    <!-- frosted name panel -->
    <rect x="60" y="205" width="1080" height="70" rx="20" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1"/>
    <text x="600" y="243" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-size="32" font-weight="700" letter-spacing="6" fill="#0B2E8A">
      MEHDI ASADPOUR
    </text>
    <text x="600" y="264" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif"
          font-size="12" font-weight="400" letter-spacing="5" fill="#3D6FE0" opacity="0.85">
      AI&#160;&#160;&#215;&#160;&#160;RED&#160;TEAM
    </text>
  </g>
</svg>
